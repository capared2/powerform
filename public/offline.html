<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="robots" content="noindex" />
  <meta name="theme-color" content="#ffffff" />
  <title>Sin conexión · ResultPB</title>
  <style>
    :root { color-scheme: light; }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      min-height: 100dvh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px 24px calc(24px + env(safe-area-inset-bottom, 0px));
      background: #fff;
      color: #172554;
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
      text-align: center;
    }
    .franja { position: fixed; top: 0; left: 0; right: 0; height: 4px; background: linear-gradient(90deg, #dc2626, #fff, #1e3a8a); }
    .logo { width: 72px; height: 72px; border-radius: 18px; margin: 0 auto 20px; }
    h1 { font-size: 22px; margin: 0 0 8px; }
    p { color: #64748b; font-size: 15px; line-height: 1.5; margin: 0 auto 24px; max-width: 320px; }
    button {
      appearance: none;
      border: 0;
      border-radius: 999px;
      padding: 12px 28px;
      background: #dc2626;
      color: #fff;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
    }
    button:active { transform: scale(0.97); }
  </style>
</head>
<body>
  <div class="franja"></div>
  <main>
    <img class="logo" src="/icons/icon-192.png" alt="" width="72" height="72" />
    <h1>Sin conexión</h1>
    <p>No hay internet y esta página no está guardada todavía. Conéctate para ver los últimos números ganadores.</p>
    <button type="button" onclick="location.reload()">Reintentar</button>
  </main>
  <script>
    window.addEventListener('online', function () { location.reload(); });
  </script>
</body>
</html>
